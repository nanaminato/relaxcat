statement = "在独立实验分支上提供一个明确具有破坏性的 Excel 样式清理选项，优先移除累积的样式，允许牺牲命名样式的标识和继承关系。该选项须主动启用，是 S-EXCEL-009 和 S-EXCEL-011 对等价性和行为保持要求的例外，两条奇点的默认行为仍然适用。保留源工作簿和非样式内容，明确披露有意造成的损失及验证范围的限制，并且不得修改主分支。开发时仅使用合成数据，或由用户明确提供并授权使用的样本。"
